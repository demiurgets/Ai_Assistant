<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <style>
        /* Base Light Mode Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            transition: background-color 0.3s, color 0.3s;
        }

        #phone_number_form {
            text-align: center;
            margin: 50px auto;
        }

        #phone_number {
            padding: 10px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
        
        #reset_button {
            position: fixed;
            top: 20px; /* Adjust this value to place it correctly */
            left: 20px; /* Adjust this value to place it correctly */
            padding: 10px;
            background-color: #dc3545; /* Red background for reset */
            color: white;
            border-radius: 5px;
            cursor: pointer;
            border: none;
        }
        #reset_button:hover {
            background-color: #a71d2a; /* Darker red on hover */
        }


        #report_button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px;
            background-color: #620000; 
            color: white;
            border-radius: 5px;
            cursor: pointer;
            border: none;
        }

        #report_button:hover {
            background-color: #4f1212; 
        }

        #chat_box {
            max-width: 400px;
            margin: 20px auto;
            background: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        #conversation {
            height: 400px;
            overflow-y: scroll;
            padding: 15px;
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
        }

        #conversation::-webkit-scrollbar {
            width: 8px;
        }

        #conversation::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }

        .message {
            margin: 10px 0;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .user {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .assistant {
            background-color: #f1f1f1;
            color: black;
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }

        .message b {
            font-weight: bold;
        }

        .message ol {
            padding-left: 20px;
            margin: 10px 0;
        }

        .message ol li {
            margin-bottom: 5px;
        }

        #user_message {
            width: 100%;
            padding: 15px;
            border: none;
            border-top: 1px solid #ddd;
            outline: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        #user_message::placeholder {
            color: #aaa;
        }

        #send_button {
            padding: 15px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-top-right-radius: 10px;
            outline: none;
        }

        #send_button:hover {
            background-color: #0056b3;
        }

        #issue_text {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .chat-input {
            display: flex;
            border-top: 1px solid #ddd;
        }

        /* Dark Mode Styles */
        body.dark-mode {
            background-color: #282828;
            color: #e0e0e0;
        }

       


        body.dark-mode #chat_box {
            background: #1e1e1e;
        }

        body.dark-mode #conversation {
            background: #212121;
        }

        body.dark-mode .message.user {
            background-color: #6200ea;
        }

        body.dark-mode .message.assistant {
            background-color: #3d3d3d;
            color: #e0e0e0;
        }

        body.dark-mode button {
            background-color: #6200ea;
        }

        body.dark-mode button:hover {
            background-color: #3700b3;
        }

        #dark_mode_toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border-radius: 50%;
            cursor: pointer;
        }

        #dark_mode_toggle:hover {
            background-color: #0056b3;
        }

        body.dark-mode .modal-content {
            background-color: #1c1c1c;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
            border-radius: 10px;
        }

        /* Report Issue Modal Styles */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1; 
            left: 0;
            top: 25;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.5); 
        }

        .modal-content {
            background-color: #ffffff;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
            border-radius: 10px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover, 
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

       

    </style>
</head>
<body>

    <!-- Dark Mode Toggle Button -->
    <button id="dark_mode_toggle" onclick="toggleDarkMode()">🌙</button>
    <!-- Report Issue Button -->

    <!-- Report Issue Modal -->
    <div id="report_issue_modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeReportIssueModal()">&times;</span>
            <h2>Report Strange Behavior</h2>
            <textarea id="issue_text" placeholder="Describe the issue here..."></textarea>
            <button onclick="submitIssueReport()">Submit</button>
        </div>
    </div>


    <div id="phone_number_form">
        <h2>Welcome! Please enter your phone number:</h2>
        <input type="text" id="phone_number" placeholder="Enter phone number" />
        <button onclick="savePhoneNumber()">Save</button>
    </div>

    <div id="chat_box" style="display:none;">
        <button id="report_button" onclick="openReportIssueModal()">Report Strange Behavior</button>

        <button id="reset_button" onclick="resetConversation()">Reset</button>
        <h2 style="text-align:center;">Chat</h2>
        <div id="conversation"></div>
        <div class="chat-input">
            <textarea id="user_message" placeholder="Type your message..."></textarea>
            <button id="send_button" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Reset Button -->

    <script>
        let phoneNumber = sessionStorage.getItem('phone_number');

        if (phoneNumber) {
            document.getElementById('phone_number_form').style.display = 'none';
            fetchConversation(phoneNumber);
        } else {
            document.getElementById('phone_number_form').style.display = 'block';
            document.getElementById('chat_box').style.display = 'none';
        }

        function savePhoneNumber() {
            phoneNumber = document.getElementById('phone_number').value;
            if (phoneNumber) {
                sessionStorage.setItem('phone_number', phoneNumber);
                document.getElementById('phone_number_form').style.display = 'none';
                fetchConversation(phoneNumber);
            }
        }

        function fetchConversation(phoneNumber) {
            fetch(`/conversation_by_phone/${phoneNumber}`)
                .then(response => response.json())
                .then(data => {
                    let conversation = data.conversation;
                    let chatBox = document.getElementById('conversation');
                    chatBox.innerHTML = '';
                    conversation.forEach(msg => appendMessage(msg.role, msg.message));
                    document.getElementById('chat_box').style.display = 'block';
                })
                .catch(error => console.error('Error fetching conversation:', error));
        }

        function parseMarkdownToHTML(message) {
            message = message.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");
            message = message.replace(/(\d+)\.\s(.*?)(?=\n|$)/g, "<li>$2</li>");
            if (message.includes("<li>")) {
                message = `<ol>${message}</ol>`;
            }
            message = message.replace(/\n/g, "<br>");
            return message;
        }

        function appendMessage(role, message) {
            let chatBox = document.getElementById('conversation');
            let msgDiv = document.createElement('div');
            msgDiv.classList.add('message', role === 'assistant' ? 'assistant' : 'user');
            if (role === 'assistant') {
                msgDiv.innerHTML = parseMarkdownToHTML(message);
            } else {
                msgDiv.textContent = message;
            }
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        function openReportIssueModal() {
            document.getElementById('report_issue_modal').style.display = 'block';
        }

        function closeReportIssueModal() {
            document.getElementById('report_issue_modal').style.display = 'none';
        }

        function submitIssueReport() {
            const issueDescription = document.getElementById('issue_text').value;
            if (!issueDescription) {
                alert('Please enter a description of the issue.');
                return;
            }

            fetch('/report_issue', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    phone_number: phoneNumber, 
                    issue: issueDescription 
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Thank you, your report was submitted succesfully.');
                    closeReportIssueModal();
                } else {
                    alert('Failed to report the issue.');
                }
            })
            .catch(error => console.error('Error reporting issue:', error));
        }

        function sendMessage() {
            let message = document.getElementById('user_message').value;
            if (!message || !phoneNumber) return;

            appendMessage('user', message);
            document.getElementById('user_message').value = '';

            fetch('/ui_send_message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, phone_number: phoneNumber })
            })
            .then(response => response.json())
            .then(data => {
                if (data.response) {
                    appendMessage('assistant', data.response);
                }
            })
            .catch(error => console.error('Error sending message:', error));
        }

        function resetConversation() {
            fetch(`/candidates/phone/${phoneNumber}`, { method: 'DELETE' })
            .then(response => {
                if (response.ok) {
                    alert('Conversation reset successfully');
                    sessionStorage.removeItem('phone_number');
                    window.location.reload();
                } else {
                    alert('Failed to reset conversation');
                }
            })
            .catch(error => console.error('Error resetting conversation:', error));
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }
    </script>
</body>
</html>
