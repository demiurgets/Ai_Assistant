<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="flask-api-token" content="FLASK_API_TOKEN_PLACEHOLDER">
    <title>Chat Application</title>
    <style>
        /* Base Light Mode Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            transition: background-color 0.3s, color 0.3s;
        }

        #candidate_identifier_form {
            text-align: center;
            margin: 50px auto;
        }

        #candidate_identifier {
            padding: 10px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
        
        #reset_button {
            position: fixed;
            bottom: 20px; /* Adjust this value to place it correctly */
            left: 20px; /* Adjust this value to place it correctly */
            padding: 10px;
            background-color: #dc3545; /* Red background for reset */
            color: white;
            border-radius: 5px;
            cursor: pointer;
            border: none;
        }
        #reset_button:hover {
            background-color: #a71d2a; /* Darker red on hover */
        }


        #report_button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px;
            background-color: #620000; 
            color: white;
            border-radius: 5px;
            cursor: pointer;
            border: none;
        }

        #report_button:hover {
            background-color: #4f1212; 
        }

        #chat_box {
            max-width: 400px;
            margin: 20px auto;
            background: white;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        #conversation {
            height: 400px;
            overflow-y: scroll;
            padding: 15px;
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
        }

        #conversation::-webkit-scrollbar {
            width: 8px;
        }

        #conversation::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }

        .message {
            margin: 10px 0;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .user {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .assistant {
            background-color: #f1f1f1;
            color: black;
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }

        .message b {
            font-weight: bold;
        }

        .message ol {
            padding-left: 20px;
            margin: 10px 0;
        }

        .message ol li {
            margin-bottom: 5px;
        }

        #user_message {
            width: 100%;
            padding: 15px;
            border: none;
            border-top: 1px solid #ddd;
            outline: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        #user_message::placeholder {
            color: #aaa;
        }

        #send_button {
            padding: 15px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-top-right-radius: 10px;
            outline: none;
        }

        #send_button:hover {
            background-color: #0056b3;
        }

        #issue_text {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .chat-input {
            display: flex;
            border-top: 1px solid #ddd;
        }

        /* Dark Mode Styles */
        body.dark-mode {
            background-color: #282828;
            color: #e0e0e0;
        }

        body.dark-mode #chat_box {
            background: #1e1e1e;
        }

        body.dark-mode #conversation {
            background: #212121;
        }

        body.dark-mode .message.user {
            background-color: #6200ea;
        }

        body.dark-mode .message.assistant {
            background-color: #3d3d3d;
            color: #e0e0e0;
        }

        body.dark-mode button {
            background-color: #6200ea;
        }

        body.dark-mode button:hover {
            background-color: #3700b3;
        }

        #dark_mode_toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border-radius: 50%;
            cursor: pointer;
        }

        #dark_mode_toggle:hover {
            background-color: #0056b3;
        }

        body.dark-mode .modal-content {
            background-color: #1c1c1c;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
            border-radius: 10px;
        }
        /* Dark Mode Styles for CV Analysis Section */
        body.dark-mode #cv_analysis_section {
            background-color: #1e1e1e;
            color: #e0e0e0;
        }

        body.dark-mode #cv_analysis_section h3 {
            color: #e0e0e0;
            background-color: black;
        }

        body.dark-mode #cv_analysis_content {
            color: #e0e0e0;
        }

        body.dark-mode #cv_analysis_content ul {
            list-style-type: none; /* Remove default list styling */
            padding-left: 0; /* Remove default padding */
        }

        body.dark-mode #cv_analysis_content li {
            margin-bottom: 5px;
        }

        body.dark-mode #cv_analysis_content strong {
            color: #c8a0f9; /* Highlighted color for strong text */
        }

        body.dark-mode #cv_analysis_content button {
            background-color: #6200ea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            padding: 10px;
            margin-top: 10px;
        }

        body.dark-mode #cv_analysis_content button:hover {
            background-color: #3700b3;
        }

        /* Report Issue Modal Styles */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1; 
            left: 0;
            top: 25;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.5); 
        }

        .modal-content {
            background-color: #ffffff;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
            border-radius: 10px;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover, 
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        #cv_upload_section {
            text-align: center;
            margin: 50px auto;
        }

        #drop_area {
            width: 300px;
            height: 150px;
            border: 2px dashed #007bff;
            border-radius: 10px;
            margin: 20px auto;
            padding: 20px;
            color: #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #drop_area.dragover {
            border-color: #0056b3;
            color: #0056b3;
        }

        /* Spinner Styles */
        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
            display: none; /* hidden by default */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <!-- Dark Mode Toggle Button -->
    <button id="dark_mode_toggle" onclick="toggleDarkMode()">🌙</button>
    <!-- Report Issue Button -->

    <!-- Report Issue Modal -->
    <div id="report_issue_modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeReportIssueModal()">&times;</span>
            <h2>Report Strange Behavior</h2>
            <textarea id="issue_text" placeholder="Describe the issue here..."></textarea>
            <button onclick="submitIssueReport()">Submit</button>
        </div>
    </div>
    <div id="cv_modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeCvModal()">&times;</span>
            <h2>Upload Your CV</h2>
            <input type="file" id="cv_input" accept=".pdf" style="display:none;" onchange="handleFileSelect(event)">
            <button onclick="document.getElementById('cv_input').click()">Select CV</button>
            <div id="drop_area" ondrop="handleDrop(event)" ondragover="handleDragOver(event)">
                Drag and drop your CV here
            </div>
            <div id="upload_spinner" class="spinner"></div>
            <p id="upload_feedback" style="display:none; color: #007bff;">Analyzing your Document, please wait...</p>
        </div>
        
    </div>
    

    <div id="candidate_identifier_form">
        <h2>Welcome! Please enter your phone number:</h2>
        <input type="text" id="candidate_identifier" placeholder="Enter phone number" />
        <button onclick="saveCandidateIdentifier()">Save</button>
    </div>

    <div id="chat_box" style="display:none;">
        <button onclick="openCvModal()">Upload Your CV</button>
        <button id="reset_button" onclick="resetConversation()">Reset</button>

        <h2 style="text-align:center;">Chat</h2>
        <div id="conversation"></div>
        <div class="chat-input" id="chat-input">
            <textarea id="user_message" placeholder="Type your message..."></textarea>
            <button id="send_button" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <button id="report_button" onclick="openReportIssueModal()">Report Strange Behavior</button>

    <div id="cv_analysis_section" style="display:none; max-width: 400px; margin: 20px auto; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1); border-radius: 10px; padding: 15px;">
        <h3>CV Analysis</h3>
        <div id="cv_analysis_content"></div>
    </div>

    <script>
        let candidate_identifier = sessionStorage.getItem('candidate_identifier');

        if (candidate_identifier) {
            document.getElementById('candidate_identifier_form').style.display = 'none';
            fetchConversation(candidate_identifier);
            

        } else {
            document.getElementById('candidate_identifier_form').style.display = 'block';
            document.getElementById('chat_box').style.display = 'none';
        }

        function saveCandidateIdentifier() {
            candidate_identifier = document.getElementById('candidate_identifier').value;
            if (candidate_identifier) {
                sessionStorage.setItem('candidate_identifier', candidate_identifier);
                document.getElementById('candidate_identifier_form').style.display = 'none';
                fetchConversation(candidate_identifier);
                //startAutoRefresh();  // Start polling once we have a candidate ID

            }
        }
        let lastConversationLength = 0;

        function fetchConversation(candidate_identifier) {
            const token = document.querySelector('meta[name="flask-api-token"]').getAttribute('content');
            fetch(`/conversation_by_candidate_identifier/${candidate_identifier}`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => response.json())
            .then(data => {
                const conversation = data.conversation || [];
                const conversationDiv = document.getElementById('conversation');

                // Clear current conversation before displaying updated list
                conversationDiv.innerHTML = '';

                // Render all messages in the chat
                conversation.forEach(msg => {
                    appendMessage(msg.role, msg.message);
                });
                setTimeout(() => {
                    conversationDiv.scrollTop = conversationDiv.scrollHeight;
                }, 1000);
                // Store current length to compare later
                lastConversationLength = conversation.length;

                // Make sure chat is visible
                document.getElementById('chat_box').style.display = 'block';
            })
            .catch(error => console.error('Error fetching conversation:', error));
        }

        function displayCvAnalysis(data) {
            let cvAnalysis = data.cv_analysis;
            let similarPositions = data.matched_positions;

            let analysisContent = '';

            // We'll build the HTML using one shared function.
            // This function appends list items for both cvAnalysis and matchedPositions.
            function iterateObject(obj, indent = 0) {
                let html = '';
                for (let key in obj) {
                    if (typeof obj[key] === 'object' && !Array.isArray(obj[key])) {
                        // If the value is another nested object, show its key, then recurse
                        html += `<li style="margin-left:${indent}px;"><strong>${key}:</strong></li>`;
                        html += iterateObject(obj[key], indent + 20);
                    } else if (Array.isArray(obj[key])) {
                        // If the value is an array, list each item
                        html += `<li style="margin-left:${indent}px;"><strong>${key}:</strong><ul>`;
                        obj[key].forEach(item => {
                            if (typeof item === 'object') {
                                html += iterateObject(item, indent + 20);
                            } else {
                                html += `<li style="margin-left:${indent + 20}px;">${item}</li>`;
                            }
                        });
                        html += '</ul></li>';
                    } else {
                        // For simple key-value pairs, just show them as a list item
                        html += `<li style="margin-left:${indent}px;"><strong>${key}:</strong> ${obj[key]}</li>`;
                    }
                }
                return html;
            }

            // 1) Build the HTML for CV Analysis
            analysisContent += '<h4>CV Analysis</h4><ul>';
            analysisContent += iterateObject(cvAnalysis);
            analysisContent += '</ul>';

            // 2) Build the HTML for Matched Positions
            analysisContent += '<h4>Matched Positions</h4><ul>';
            analysisContent += iterateObject(similarPositions);
            analysisContent += '</ul>';

            // Finally, place everything into the CV Analysis section on the page
            const cvAnalysisSection = document.getElementById('cv_analysis_section');
            const cvAnalysisContent = document.getElementById('cv_analysis_content');
            cvAnalysisContent.innerHTML = analysisContent;

            cvAnalysisSection.style.display = 'block';

        }

        function findMatchingPositions() {
            const matchButton = document.querySelector('#cv_analysis_content button');
            const matchingLabel = document.querySelector('#cv_analysis_content strong');

            // Change the button text to "Matching..."
            matchButton.textContent = 'Matching...';
            matchButton.disabled = true; // Optionally disable the button to prevent multiple clicks

            fetch(`/documents/match_cv/${candidate_identifier}`)
                .then(response => response.json())
                .then(data => {
                    if (data.matchingPositions) {
                        // Parse the matching positions from Markdown to HTML
                        const parsedHTML = parseMarkdownToHTML(data.matchingPositions);

                        // Display the matching positions string
                        const matchingPositionsDiv = document.createElement('div');
                        matchingPositionsDiv.style.marginTop = '20px';
                        matchingPositionsDiv.innerHTML = `<strong>Matching Positions:</strong> ${parsedHTML}`;
                        
                        const cvAnalysisContent = document.getElementById('cv_analysis_content');
                        cvAnalysisContent.appendChild(matchingPositionsDiv);
                    } else {
                        alert('No matching positions found.');
                    }
                })
                .catch(error => console.error('Error finding matching positions:', error))
                .finally(() => {
                    // Remove the button and the label after the response is handled
                    if (matchButton) {
                        matchButton.remove();
                    }
                    if (matchingLabel) {
                        matchingLabel.remove();
                    }
                });
        }

        function parseMarkdownToHTML(message) {
            message = message.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");
            message = message.replace(/(\d+)\.\s(.*?)(?=\n|$)/g, "<li>$2</li>");
            if (message.includes("<li>")) {
                message = `<ol>${message}</ol>`;
            }
            message = message.replace(/\n/g, "<br>");
            return message;
        }

        function appendMessage(role, message) {
            let chatBox = document.getElementById('conversation');
            let msgDiv = document.createElement('div');
            msgDiv.classList.add('message', role === 'assistant' ? 'assistant' : 'user');
            if (role === 'assistant') {
                msgDiv.innerHTML = parseMarkdownToHTML(message);
            } else {
                msgDiv.textContent = message;
            }
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        function openReportIssueModal() {
            document.getElementById('report_issue_modal').style.display = 'block';
        }

        function closeReportIssueModal() {
            document.getElementById('report_issue_modal').style.display = 'none';
        }

        function submitIssueReport() {
            const issueDescription = document.getElementById('issue_text').value;
            if (!issueDescription) {
                alert('Please enter a description of the issue.');
                return;
            }

            fetch('/report_issue', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    candidate_identifier: candidate_identifier, 
                    issue: issueDescription 
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Thank you, your report was submitted succesfully.');
                    closeReportIssueModal();
                } else {
                    alert('Failed to report the issue.');
                }
            })
            .catch(error => console.error('Error reporting issue:', error));
        }

        
        function sendMessage() {
            let message = document.getElementById('user_message').value;
            if (!message || !candidate_identifier) {
                console.log('sendMessage called, but message or candidate_identifier is missing.');
                return;
            }

            // Display user's message right away in the UI
            appendMessage('user', message);
            document.getElementById('user_message').value = '';

            // Send the message to the server
            fetch('/ui_send_message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, candidate_identifier })
            })
            .then(response => response.json())
            .then(() => {
                console.log('Message sent successfully. Starting polling for assistant response...');

                // Start repeated polling (6 tries, every 6 seconds)
                pollForNewAssistantMessage(7);
            })
            .catch(error => console.error('Error sending message:', error));
        }

        /**
         * Poll the server up to 'triesLeft' times, every 6 seconds,
         * checking if there's a new assistant message. 
         * If found, reload the page and stop polling.
         */
        function pollForNewAssistantMessage(triesLeft) {
            console.log(`Polling for new messages. Attempts remaining: ${triesLeft}`);
            const token = document.querySelector('meta[name="flask-api-token"]').getAttribute('content');

            fetch(`/conversation_by_candidate_identifier/${candidate_identifier}`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(resp => resp.json())
            .then(data => {
                const conversation = data.conversation || [];
                const currentLength = conversation.length;

                console.log('Checking for new messages...');
                console.log('lastConversationLength =', lastConversationLength, 'currentLength =', currentLength);

                // If there's a new assistant message, reload
                if (currentLength > lastConversationLength) {
                    const lastMsg = conversation[conversation.length - 1];
                    if (lastMsg && lastMsg.role === 'assistant') {
                        console.log('Found new assistant message, reloading...');
                        location.reload();
                        return;
                    } else {
                        console.log('There is an extra message, but it is not from the assistant. Not reloading.');
                    }
                }

                // If we're out of tries, stop
                if (triesLeft <= 1) {
                    console.log('No more polling attempts left, stopping.');
                    return;
                }

                // Otherwise, wait 6 seconds and try again
                setTimeout(() => {
                    pollForNewAssistantMessage(triesLeft - 1);
                }, 6000);
            })
            .catch(error => console.error('Error fetching updates:', error));
        }


        var input = document.getElementById("chat-input");

        input.addEventListener("keyup", function(event) {
            // Number 13 is the "Enter" key on the keyboard
            if (event.keyCode === 13) {
                event.preventDefault();
                document.getElementById("send_button").click();
            }
        });

        function resetConversation() {
            fetch(`/candidates/candidate_identifier/${candidate_identifier}`, { method: 'DELETE' })
            .then(response => {
                if (response.ok) {
                    alert('Conversation reset successfully');
                    sessionStorage.removeItem('candidate_identifier');
                    window.location.reload();
                } else {
                    alert('Failed to reset conversation');
                }
            })
            .catch(error => console.error('Error resetting conversation:', error));
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Check for saved theme preference in localStorage
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.body.classList.add(savedTheme);
            }
        });

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            
            // Save the current theme preference in localStorage
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark-mode');
            } else {
                localStorage.removeItem('theme');
            }
        }

        function openCvModal() {
            document.getElementById('cv_modal').style.display = 'block';
        }

        function closeCvModal() {
            document.getElementById('cv_modal').style.display = 'none';
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file && file.type === 'application/pdf') {
                uploadCV(file);
            } else {
                alert('Please upload a PDF file.');
            }
        }

        function handleDrop(event) {
            event.preventDefault();
            const file = event.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                uploadCV(file);
            } else {
                alert('Please upload a PDF file.');
            }
        }

        function handleDragOver(event) {
            event.preventDefault();
            event.currentTarget.classList.add('dragover');
        }

        function uploadCV(file) {
            const formData = new FormData();
            formData.append('cv', file);
            formData.append('candidate_identifier', candidate_identifier);

            // Show the feedback text and spinner; hide the button and drop area
            const feedbackElement = document.getElementById('upload_feedback');
            const uploadSpinner = document.getElementById('upload_spinner');
            const selectButton = document.querySelector('#cv_modal button');
            const dropArea = document.getElementById('drop_area');

            feedbackElement.style.display = 'block';
            uploadSpinner.style.display = 'block';
            selectButton.style.display = 'none';
            dropArea.style.display = 'none';

            fetch(`/documents/analyze_cv/${candidate_identifier}`, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.analysis) {
                    console.log('Analysis:', data.analysis);
                    closeCvModal();
                    location.reload(); 
                } else {
                    alert('Failed to analyze CV.');
                }
            })
            .catch(error => console.error('Error uploading CV:', error))
            .finally(() => {
                // Hide the feedback text and spinner once finished
                feedbackElement.style.display = 'none';
                uploadSpinner.style.display = 'none';
            });
        }
    </script>
</body>
</html>
